spring.application.name=MoonCake

# Load local credentials from MoonCake/.env when present. OS environment variables still take precedence.
spring.config.import=optional:file:./.env[.properties]

# SQL Server connection. Keep real credentials in MoonCake/.env or OS environment variables.
spring.datasource.url=${DB_URL:jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:MoonCakeDB};encrypt=true;trustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:true}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Flyway is the only schema owner. Hibernate must not create or modify tables.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

# Never show stack traces or internal messages to visitors (devtools turns them on otherwise).
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never

# Product photos uploaded by Admin are stored on disk, outside the source folder.
mooncake.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Forgot-password mail. Leave MAIL_HOST empty for local demos: the reset link is then only logged.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.default-encoding=UTF-8
mooncake.mail.from=${MAIL_FROM:no-reply@mooncake.local}
mooncake.public-url=${APP_PUBLIC_URL:http://localhost:8080}
mooncake.password-reset.token-minutes=${PASSWORD_RESET_TOKEN_MINUTES:30}
mooncake.password-reset.resend-seconds=${PASSWORD_RESET_RESEND_SECONDS:60}
