<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('Lô hàng')}"></head>
<body class="page-batches">
<header th:replace="~{admin/layout :: nav}"></header>
<main th:with="active=${batches.?[remainingQuantity > 0]},soon=${active.?[statusTone == 'warning']},expired=${active.?[statusTone == 'danger']},missing=${active.?[statusTone == 'muted']},used=${batches.?[remainingQuantity == 0]}">
    <div th:replace="~{admin/layout :: flash}"></div>
    <div class="page-heading page-heading--simple page-heading--with-action">
        <div>
            <span class="eyebrow">Kho</span>
            <h1>Lô hàng</h1>
        </div>
        <a class="button secondary" th:href="@{/admin/inventory}">Tới trang Tồn kho</a>
    </div>

    <nav class="tabs" aria-label="Lọc lô hàng" data-filter-tabs>
        <a href="#" class="tabs__item is-active" data-filter="available">
            <span>Còn hàng</span>
            <span class="tabs__count" th:text="${#lists.size(active)}">0</span>
        </a>
        <a href="#" class="tabs__item" data-filter="warning">
            <span>Sắp hết hạn</span>
            <span class="tabs__count" th:text="${#lists.size(soon)}">0</span>
        </a>
        <a href="#" class="tabs__item" data-filter="danger">
            <span>Hết hạn</span>
            <span class="tabs__count" th:text="${#lists.size(expired)}">0</span>
        </a>
        <a href="#" class="tabs__item" data-filter="muted">
            <span>Chưa có hạn dùng</span>
            <span class="tabs__count" th:text="${#lists.size(missing)}">0</span>
        </a>
        <a href="#" class="tabs__item" data-filter="empty">
            <span>Đã dùng hết</span>
            <span class="tabs__count" th:text="${#lists.size(used)}">0</span>
        </a>
    </nav>

    <section class="table-scroll">
        <table>
            <thead>
            <tr>
                <th>Sản phẩm</th>
                <th>Mã lô</th>
                <th>Ngày sản xuất</th>
                <th>Hạn dùng</th>
                <th class="numeric">Còn lại</th>
                <th>Tình trạng</th>
                <th class="actions-cell"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="batch : ${batches}" th:attr="data-group=${batch.remainingQuantity > 0 ? 'available ' + batch.statusTone : 'empty'}">
                <td>
                    <strong th:text="${batch.productName}">Bánh</strong>
                    <small class="muted"><code th:text="${batch.sku}">SKU</code></small>
                </td>
                <td th:text="${batch.batchCode}">Mã lô</td>
                <td th:text="${batch.producedOn == null ? '—' : #temporals.format(batch.producedOn, 'dd/MM/yyyy')}">01/09/2026</td>
                <td th:text="${batch.expiresOn == null ? '—' : #temporals.format(batch.expiresOn, 'dd/MM/yyyy')}">01/10/2026</td>
                <td class="numeric stock-number" th:text="${batch.remainingQuantity}">0</td>
                <td>
                    <span class="badge badge--dot" th:classappend="${'badge--' + batch.statusTone}" th:text="${batch.statusLabel}">Còn hạn</span>
                </td>
                <td class="actions-cell">
                    <button type="button" class="secondary small-button" th:attr="data-open-modal=${'batch-' + batch.id}">Sửa</button>
                    <dialog class="modal" th:id="${'batch-' + batch.id}"
                            th:attr="data-reopen=${dialogId == 'batch-' + batch.id ? 'true' : null}">
                        <form th:action="@{/admin/batches/{id}(id=${batch.id})}" method="post" class="modal__panel">
                            <button type="button" class="modal__close" data-dialog-close aria-label="Đóng">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                            </button>
                            <div class="modal__body">
                                <h2>Thông tin lô</h2>
                                <p class="modal__subject" th:text="${batch.productName}">Bánh</p>
                                <p class="modal__error" role="alert" th:if="${dialogId == 'batch-' + batch.id}" th:text="${dialogError}">Lỗi</p>
                                <label>Mã lô
                                    <input type="text" name="code" th:value="${batch.batchCode}" required maxlength="80">
                                </label>
                                <div class="form-grid">
                                    <label>Ngày sản xuất
                                        <input type="date" name="production" th:value="${batch.producedOn}">
                                    </label>
                                    <label>Hạn sử dụng
                                        <input type="date" name="expiry" th:value="${batch.expiresOn}">
                                    </label>
                                </div>
                            </div>
                            <div class="modal__footer">
                                <button type="button" class="secondary" data-dialog-close>Hủy</button>
                                <button type="submit" data-loading-text="Đang lưu…">Lưu thông tin</button>
                            </div>
                        </form>
                    </dialog>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="empty-state" data-filter-empty th:hidden="${!batches.isEmpty()}">
            <p><strong>Không có lô hàng nào ở mục này.</strong></p>
        </div>
    </section>
</main>
<script th:src="@{/js/pages/admin-filter-tabs.js}" defer></script>
<script th:src="@{/js/pages/admin-modal.js}" defer></script>
<script th:src="@{/js/loading-button.js}" defer></script>
</body>
</html>
