<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('Lô bánh')}"></head>
<body>
<header th:replace="~{admin/layout :: nav}"></header>
<main>
    <div th:replace="~{admin/layout :: flash}"></div>
    <div class="page-heading page-heading--simple">
        <span class="eyebrow">Kho</span>
        <h1>Lô hàng</h1>
    </div>
    <a th:href="@{/admin/inventory}">Nhập hàng và đóng hộp →</a>

    <section class="table-scroll">
        <table data-search-table>
            <thead>
            <tr>
                <th>SKU</th>
                <th>Mã lô</th>
                <th>Ngày SX</th>
                <th>Hạn dùng</th>
                <th>Còn</th>
                <th>Tình trạng</th>
                <th>Thông tin lô</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="batch : ${batches}">
                <td th:text="${batch.sku}">SKU</td>
                <td th:text="${batch.batchCode}">Mã lô</td>
                <td th:text="${batch.producedOn}">Ngày SX</td>
                <td th:text="${batch.expiresOn}">Hạn dùng</td>
                <td th:text="${batch.remainingQuantity}">0</td>
                <td th:text="${batch.statusLabel}">Còn hạn</td>
                <td>
                    <button type="button" th:attr="data-batch-dialog=${'batch-' + batch.id}">Cập nhật</button>
                    <dialog class="catalog-editor" th:id="${'batch-' + batch.id}">
                        <div class="editor-heading">
                            <h2>Thông tin lô</h2>
                            <button type="button" data-dialog-close>Đóng</button>
                        </div>
                        <form th:action="@{/admin/batches/{id}(id=${batch.id})}" method="post">
                            <label>Mã lô
                                <input name="code" th:value="${batch.batchCode}" required maxlength="80">
                            </label>
                            <label>Ngày sản xuất
                                <input name="production" type="date" th:value="${batch.producedOn}">
                            </label>
                            <label>Hạn sử dụng
                                <input name="expiry" type="date" th:value="${batch.expiresOn}">
                            </label>
                            <button type="submit">Lưu thông tin</button>
                        </form>
                    </dialog>
                </td>
            </tr>
            </tbody>
        </table>
        <p th:if="${#lists.isEmpty(batches)}">Chưa có lô hàng. Nhập kho để bắt đầu.</p>
    </section>
</main>
</body>
</html>
