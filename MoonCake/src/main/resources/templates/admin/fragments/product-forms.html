<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<p th:fragment="alert(target)" class="form-alert" role="alert"
   th:if="${formTarget != null and formTarget == target}" th:text="${formError}">Lỗi</p>

<div th:fragment="productFields(f, typeLocked)" class="form-grid">
    <label class="span-2">Tên sản phẩm
        <input type="text" name="name" th:value="${f != null ? f.name : ''}" required maxlength="220" data-slug-source>
    </label>
    <input th:if="${#lists.size(page.formOptions.categories) == 1}" type="hidden" name="categoryId" th:value="${page.formOptions.categories[0].id}">
    <label th:unless="${#lists.size(page.formOptions.categories) == 1}">Danh mục
        <select name="categoryId" required>
            <option value="">Chọn danh mục…</option>
            <option th:each="category : ${page.formOptions.categories}"
                    th:value="${category.id}"
                    th:text="${category.name}"
                    th:selected="${f != null and f.categoryId == category.id}">Danh mục</option>
        </select>
    </label>
    <input th:if="${page.formOptions.giftBox or (f != null and f.productType != null and f.productType.name() == 'GIFT_SET')}"
           type="hidden" name="productType" value="GIFT_SET">
    <label th:unless="${page.formOptions.giftBox or (f != null and f.productType != null and f.productType.name() == 'GIFT_SET')}">Loại sản phẩm
        <select name="productType" required th:if="${!typeLocked}">
            <option th:each="option : ${page.formOptions.productTypes}"
                    th:value="${option.value}"
                    th:text="${option.label}"
                    th:selected="${f != null and f.productType == option.value}">Hộp quà</option>
        </select>
        <th:block th:if="${typeLocked}">
            <input type="hidden" name="productType" th:value="${f.productType}">
            <input type="text" th:value="${page.detail.typeLabel}" readonly>
            <small class="field-hint">Đã có phiên bản nên không đổi được loại.</small>
        </th:block>
    </label>
    <label class="span-2">Đường dẫn trên web
        <input type="text" name="slug" th:value="${f != null ? f.slug : ''}" required maxlength="180"
               pattern="[a-z0-9]+(-[a-z0-9]+)*" data-error="Chỉ dùng chữ thường không dấu, số và dấu gạch ngang, ví dụ: banh-nuong." data-slug-target>
    </label>
    <label class="span-2">Mô tả ngắn
        <textarea name="shortDescription" required maxlength="600" rows="3" th:text="${f != null ? f.shortDescription : ''}"></textarea>
    </label>
    <details class="span-2 more-fields" th:open="${f != null and f.detailedDescription != null and !#strings.isEmpty(f.detailedDescription)}">
        <summary>Mô tả chi tiết</summary>
        <textarea name="detailedDescription" rows="5" aria-label="Mô tả chi tiết"
                  th:text="${f != null ? f.detailedDescription : ''}"></textarea>
    </details>
    <th:block th:if="${page.formOptions.giftBox or (f != null and f.productType != null and f.productType.name() == 'GIFT_SET')}">
        <input type="hidden" name="mainIngredients" th:value="${f != null ? f.mainIngredients : ''}">
        <label>Hạn sử dụng
            <textarea name="shelfLifeInfo" maxlength="350" rows="2" placeholder="Ví dụ: 30 ngày kể từ ngày sản xuất"
                      th:text="${f != null ? f.shelfLifeInfo : ''}"></textarea>
        </label>
        <label>Cách bảo quản
            <textarea name="storageGuidance" maxlength="600" rows="2" placeholder="Ví dụ: Nơi khô ráo, tránh nắng"
                      th:text="${f != null ? f.storageGuidance : ''}"></textarea>
        </label>
    </th:block>
    <th:block th:unless="${page.formOptions.giftBox or (f != null and f.productType != null and f.productType.name() == 'GIFT_SET')}">
    <label class="span-2">Thành phần chính
        <textarea name="mainIngredients" maxlength="700" rows="3" th:text="${f != null ? f.mainIngredients : ''}"></textarea>
    </label>
    <label>Hạn sử dụng
        <textarea name="shelfLifeInfo" maxlength="350" rows="2" placeholder="Ví dụ: 30 ngày kể từ ngày sản xuất"
                  th:text="${f != null ? f.shelfLifeInfo : ''}"></textarea>
    </label>
    <label>Cách bảo quản
        <textarea name="storageGuidance" maxlength="600" rows="2" placeholder="Ví dụ: Nơi khô ráo, tránh nắng"
                  th:text="${f != null ? f.storageGuidance : ''}"></textarea>
    </label>
    </th:block>
</div>

<form th:fragment="product(f, typeLocked)" th:action="@{/admin/products}" method="post" class="product-form" data-slug-form>
    <input type="hidden" name="id" th:if="${f != null}" th:value="${f.id}">
    <div th:replace="~{admin/fragments/product-forms :: productFields(${f}, ${typeLocked})}"></div>
    <div class="form-footer">
        <input th:if="${page.formOptions.giftBox or hideSaleSwitch == true}" type="hidden" name="active" th:value="${f != null and f.active}">
        <label class="switch-card" th:unless="${page.formOptions.giftBox or hideSaleSwitch == true}">
            <input type="hidden" name="_active" value="on">
            <input type="checkbox" class="switch" name="active" value="true" th:checked="${f != null and f.active}">
            <span class="switch-card__text">
                <strong>Hiển thị trên cửa hàng</strong>
            </span>
        </label>
        <button type="submit" data-loading-text="Đang lưu…" th:text="${f == null ? 'Tạo sản phẩm' : 'Lưu thông tin'}">Lưu</button>
    </div>
</form>

<form th:fragment="sku(f, productId)" th:action="@{/admin/variants}" method="post" class="product-form"
      th:with="editing=${f != null and f.id != null}">
    <input type="hidden" name="id" th:if="${editing}" th:value="${f.id}">
    <input type="hidden" name="productId" th:value="${productId}">
    <div class="form-grid" th:with="cake=${page.detail.product.productType.name() == 'MOONCAKE'}">
        <label>Mã SKU
            <input type="text" name="sku" th:value="${f != null ? f.sku : ''}" required maxlength="80" th:readonly="${editing}"
                   pattern="[A-Za-z0-9]+([\-_][A-Za-z0-9]+)*" data-uppercase data-error="Mã SKU chỉ dùng chữ không dấu, số và dấu gạch ngang, ví dụ: GIFT-4-TRANG.">
        </label>
        <label>Tên phiên bản
            <input type="text" name="name" th:value="${f != null ? f.name : ''}" required maxlength="200"
                   placeholder="Ví dụ: Hộp 4 bánh">
        </label>
        <label>Giá bán (đ)
            <input type="number" name="unitPrice" th:value="${f != null ? f.unitPrice : ''}"
                   required min="1000" max="100000000" step="1000" data-min-error="Giá bán thấp nhất là 1.000đ." data-step-error="Giá bán phải là bội số của 1.000đ, ví dụ 450000.">
        </label>
        <label>Khối lượng (g)
            <input type="number" name="weightGrams" th:value="${f != null ? f.weightGrams : ''}" th:required="${cake}"
                   min="1" max="5000" data-max-error="Khối lượng tối đa 5.000g.">
        </label>
        <input th:if="${page.formOptions.giftBox}" type="hidden" name="fillingLabel" th:value="${f != null ? f.fillingLabel : ''}">
        <label class="span-2" th:unless="${page.formOptions.giftBox}">Nhân bánh
            <input type="text" name="fillingLabel" th:value="${f != null ? f.fillingLabel : ''}" maxlength="180"
                   th:required="${cake}" placeholder="Ví dụ: Thập cẩm lạp xưởng">
        </label>
    </div>
    <div class="form-footer">
        <input th:if="${page.formOptions.giftBox or hideSaleSwitch == true}" type="hidden" name="active" th:value="${f != null and f.active}">
        <label class="switch-card" th:unless="${page.formOptions.giftBox or hideSaleSwitch == true}">
            <input type="hidden" name="_active" value="on">
            <input type="checkbox" class="switch" name="active" value="true" th:checked="${f != null and f.active}">
            <span class="switch-card__text">
                <strong>Mở bán phiên bản này</strong>
            </span>
        </label>
        <button type="submit" data-loading-text="Đang lưu…" th:text="${editing ? 'Lưu phiên bản' : 'Thêm phiên bản'}">Lưu</button>
    </div>
</form>

<form th:fragment="category(f)" th:action="@{/admin/categories}" method="post" class="product-form">
    <input type="hidden" name="id" th:if="${f != null and f.id != null}" th:value="${f.id}">
    <div class="form-grid">
        <label class="span-2">Tên danh mục
            <input type="text" name="name" th:value="${f != null ? f.name : ''}" required maxlength="160" data-slug-source>
        </label>
        <label class="span-2">Đường dẫn trên web
            <input type="text" name="slug" th:value="${f != null ? f.slug : ''}" required maxlength="160"
                   pattern="[a-z0-9]+(-[a-z0-9]+)*" data-error="Chỉ dùng chữ thường không dấu, số và dấu gạch ngang, ví dụ: banh-nuong." data-slug-target>
        </label>
    </div>
    <div class="form-footer">
        <label class="switch-card">
            <input type="hidden" name="_active" value="on">
            <input type="checkbox" class="switch" name="active" value="true" th:checked="${f != null and f.active}">
            <span class="switch-card__text">
                <strong>Hiển thị trên cửa hàng</strong>
            </span>
        </label>
        <button type="submit" data-loading-text="Đang lưu…">Lưu danh mục</button>
    </div>
</form>

<label th:fragment="dropzone(required)" class="dropzone" data-dropzone>
    <input type="file" name="imageFile" accept="image/jpeg,image/png,image/webp" th:required="${required}" data-dropzone-input>
    <span class="dropzone__preview" hidden>
        <img alt="">
        <span class="dropzone__change">Bấm hoặc kéo ảnh khác để đổi</span>
    </span>
    <span class="dropzone__empty">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
        <strong>Kéo thả ảnh vào đây</strong>
        <small>hoặc bấm để chọn · JPG, PNG, WebP, tối đa 5MB</small>
    </span>
    <span class="dropzone__error" hidden data-dropzone-error></span>
</label>

<div th:fragment="imageManager(sku, productId)" class="image-manager">
    <h3 th:text="${'Ảnh (' + #lists.size(sku.images) + ')'}">Ảnh</h3>
    <ul class="image-grid">
        <li th:each="image : ${sku.images}" class="image-tile">
            <img th:src="${image.imageUrl}" th:alt="${image.altText}" loading="lazy">
            <span th:if="${image.primary}" class="badge badge--success image-tile__flag">Ảnh chính</span>
            <div class="image-tile__actions">
                <form th:unless="${image.primary}" th:action="@{/admin/images}" method="post" class="image-tile__main">
                    <input type="hidden" name="productId" th:value="${productId}">
                    <input type="hidden" name="id" th:value="${image.id}">
                    <input type="hidden" name="variantId" th:value="${image.variantId}">
                    <input type="hidden" name="imageUrl" th:value="${image.imageUrl}">
                    <input type="hidden" name="altText" th:value="${image.altText}">
                    <input type="hidden" name="sortOrder" th:value="${image.sortOrder}">
                    <input type="hidden" name="primary" value="true">
                    <button type="submit" class="image-tile__button">Đặt làm ảnh chính</button>
                </form>
                <span th:if="${image.primary}" class="image-tile__main image-tile__note">Đang là ảnh chính</span>
                <form th:action="@{/admin/images/{id}/remove(id=${image.id})}" method="post">
                    <input type="hidden" name="productId" th:value="${productId}">
                    <input type="hidden" name="variantId" th:value="${image.variantId}">
                    <button type="submit" class="image-tile__button image-tile__button--danger" aria-label="Xóa ảnh" title="Xóa ảnh">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
                    </button>
                </form>
            </div>
        </li>
        <li class="image-tile image-tile--add">
            <form th:action="@{/admin/images/upload}" method="post" enctype="multipart/form-data">
                <input type="hidden" name="productId" th:value="${productId}">
                <input type="hidden" name="variantId" th:value="${sku.form.id}">
                <input type="hidden" name="sortOrder" th:value="${#lists.size(sku.images)}">
                <input type="hidden" name="primary" th:value="${sku.images.isEmpty()}">
                <label class="add-tile" data-auto-upload>
                    <input type="file" name="imageFile" accept="image/jpeg,image/png,image/webp">
                    <span class="add-tile__icon" aria-hidden="true">+</span>
                    <strong>Thêm ảnh</strong>
                    <small>Kéo thả hoặc bấm để chọn</small>
                    <small>JPG, PNG, WebP, tối đa 5MB</small>
                    <span class="add-tile__error" data-auto-upload-error hidden></span>
                </label>
            </form>
        </li>
    </ul>
    <details class="url-option">
        <summary>Hoặc dùng đường dẫn ảnh có sẵn</summary>
        <form th:action="@{/admin/images}" method="post" class="url-option__form">
            <input type="hidden" name="productId" th:value="${productId}">
            <input type="hidden" name="variantId" th:value="${sku.form.id}">
            <input type="hidden" name="sortOrder" th:value="${#lists.size(sku.images)}">
            <input type="hidden" name="_primary" value="on">
            <input type="text" name="imageUrl" required maxlength="1000"
                   pattern="(https?://\S+|/images/\S+|/uploads/\S+)"
                   data-error="Đường dẫn phải bắt đầu bằng https://, /images/ hoặc /uploads/."
                   placeholder="https://... hoặc /images/products/..." aria-label="Đường dẫn ảnh">
            <button type="submit" class="secondary">Thêm ảnh</button>
        </form>
    </details>
</div>

</body>
</html>
