<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('Kho & đóng hộp')}"></head>
<body class="page-inventory">
<header th:replace="~{admin/layout :: nav}"></header>
<main>
    <div th:replace="~{admin/layout :: flash}"></div>
    <div class="page-heading page-heading--simple"><span class="eyebrow">Kho</span><h1>Kho &amp; đóng hộp</h1></div>
    <section class="table-scroll"><h2>Tồn kho hiện tại</h2>
        <table data-search-table>
            <thead>
            <tr>
                <th>SKU</th>
                <th>Tên</th>
                <th>Có thể bán</th>
                <th>Ngưỡng cảnh báo</th>
                <th>Tình trạng</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b : ${balances}" th:classappend="${b.low()} ? 'warning'">
                <td th:text="${b.sku}"></td>
                <td th:text="${b.name}"></td>
                <td th:text="${b.quantity}"></td>
                <td th:text="${b.threshold}"></td>
                <td th:text="${b.low()} ? 'Sắp hết' : 'Đủ tồn'"></td>
            </tr>
            </tbody>
        </table>
    </section>
    <section><h2>Nhập kho</h2>
        <form th:action="@{/admin/inventory/receive}" method="post"><input type="hidden" name="operationKey"
                                                                           th:value="${receiveKey}">
            <div class="grid"><label>SKU<select name="variantId" required>
                <option th:each="b : ${balances}" th:value="${b.variantId}"
                        th:text="${b.sku + ' — ' + b.name}"></option>
            </select></label><label>Số lượng<input type="number" name="quantity" required min="1"></label><label>Lý do /
                ghi chú<input name="reason" required maxlength="500"></label></div>
            <div class="actions">
                <button>Nhập kho</button>
            </div>
        </form>
    </section>
    <section><h2>Điều chỉnh kho</h2>
        <form th:action="@{/admin/inventory/adjust}" method="post"><input type="hidden" name="operationKey"
                                                                          th:value="${adjustKey}">
            <div class="grid"><label>SKU<select name="variantId" required>
                <option th:each="b : ${balances}" th:value="${b.variantId}"
                        th:text="${b.sku + ' — ' + b.name}"></option>
            </select></label><label>Số tăng/giảm (ví dụ -2)<input type="number" name="quantity" required></label><label>Lý
                do / ghi chú<input name="reason" required maxlength="500"></label></div>
            <div class="actions">
                <button>Điều chỉnh kho</button>
            </div>
        </form>
    </section>
    <section><h2>Đóng hộp PRESET</h2>
        <form th:action="@{/admin/inventory/pack}" method="post"><input type="hidden" name="operationKey"
                                                                        th:value="${packKey}">
            <div class="grid"><label>SKU<select name="variantId" required>
                <option th:each="p : ${presets}" th:if="${p.status.name() == 'READY'}" th:value="${p.giftSetVariantId}"
                        th:text="${p.sku}"></option>
            </select></label><label>Số lượng<input type="number" name="quantity" required min="1"></label><label>Lý do /
                ghi chú<input name="reason" required maxlength="500"></label></div>
            <div class="actions">
                <button>Đóng hộp PRESET</button>
            </div>
        </form>
    </section>
    <section class="table-scroll"><h2>Lịch sử biến động</h2>
        <table data-search-table>
            <thead>
            <tr>
                <th>Ngày (UTC)</th>
                <th>SKU</th>
                <th>Thao tác</th>
                <th>Tăng/giảm</th>
                <th>Lý do</th>
                <th>Nhóm thao tác / đơn</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${movements}">
                <td th:text="${m.createdAt}"></td>
                <td th:text="${m.sku}"></td>
                <td th:text="${m.type}"></td>
                <td th:text="${m.delta}"></td>
                <td th:text="${m.reason}"></td>
                <td><small th:text="${m.groupKey}"></small><a th:if="${m.orderId}"
                                                              th:href="@{/admin/orders/{id}(id=${m.orderId})}"
                                                              th:text="${'Đơn #' + m.orderId}"></a></td>
            </tr>
            </tbody>
        </table>
        <div class="actions"><a th:if="${page > 0}" th:href="@{/admin/inventory(page=${page-1})}">Trang trước</a><a
                th:if="${movements.size() == 50}" th:href="@{/admin/inventory(page=${page+1})}">Trang sau</a></div>
    </section>
</main>
</body>
</html>
