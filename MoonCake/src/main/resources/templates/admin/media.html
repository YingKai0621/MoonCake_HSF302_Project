<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/layout :: head('Ảnh & video')}"></head><body><header th:replace="~{admin/layout :: nav}"></header><main><div th:replace="~{admin/layout :: flash}"></div><h1>Ảnh &amp; video sản phẩm</h1><p>Thêm nhiều ảnh trong <a th:href="@{/admin/catalog#images}">Sản phẩm → Ảnh sản phẩm</a>. Video dùng đường dẫn trực tiếp MP4 hoặc WebM.</p><section><h2>Thêm video</h2><form th:action="@{/admin/media}" method="post"><div class="grid"><label>Sản phẩm<select name="productId" required><option th:each="p:${catalog.products}" th:value="${p.id}" th:text="${p.name}"></option></select></label><label>Đường dẫn video<input name="url" required maxlength="1000" placeholder="https://…/video.mp4"></label><label>Mô tả<input name="caption" required maxlength="250"></label></div><div class="actions"><button>Thêm video</button></div></form></section><section class="table-scroll"><h2>Video hiện có</h2><table data-search-table><thead><tr><th>Sản phẩm</th><th>Xem trước</th><th>Mô tả</th><th>Thao tác</th></tr></thead><tbody><tr th:each="v:${videos}"><td th:text="${v[1]}"></td><td><video controls preload="none" width="220" th:src="${v[2]}"></video></td><td th:text="${v[3]}"></td><td><form th:action="@{/admin/media/{id}/remove(id=${v[0]})}" method="post"><button class="danger">Xóa video</button></form></td></tr></tbody></table><p th:if="${#lists.isEmpty(videos)}" class="muted">Chưa có video. Thêm đường dẫn ở biểu mẫu phía trên.</p></section></main></body></html>
