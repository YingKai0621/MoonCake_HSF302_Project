<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('Ảnh & video')}"></head>
<body>
<header th:replace="~{admin/layout :: nav}"></header>
<main>
    <div th:replace="~{admin/layout :: flash}"></div>
    <div class="page-heading page-heading--simple">
        <span class="eyebrow">Sản phẩm</span>
        <h1>Video sản phẩm</h1>
    </div>

    <section>
        <h2>Thêm video</h2>
        <form th:action="@{/admin/media}" method="post">
            <div class="grid">
                <label>Sản phẩm
                    <select name="productId" required>
                        <option th:each="product : ${catalog.products}"
                                th:value="${product.id}"
                                th:text="${product.name}">Sản phẩm</option>
                    </select>
                </label>
                <label>Đường dẫn video
                    <input name="url" required maxlength="1000" placeholder="https://…/video.mp4" pattern="(https://\S+|/images/\S+)\.(mp4|webm)(\?\S*)?" data-error="Đường dẫn video phải là link https:// hoặc /images/ tới file .mp4 hoặc .webm.">
                </label>
                <label>Mô tả
                    <input name="caption" required maxlength="250">
                </label>
            </div>
            <div class="actions">
                <button type="submit">Thêm video</button>
            </div>
        </form>
    </section>

    <section class="table-scroll">
        <h2>Video hiện có</h2>
        <table data-search-table>
            <thead>
            <tr>
                <th>Sản phẩm</th>
                <th>Xem trước</th>
                <th>Mô tả</th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="video : ${videos}">
                <td th:text="${video.productName}">Sản phẩm</td>
                <td><video controls preload="none" width="220" th:src="${video.url}"></video></td>
                <td th:text="${video.caption}">Mô tả</td>
                <td>
                    <form th:action="@{/admin/media/{id}/remove(id=${video.id})}" method="post">
                        <button type="submit" class="danger">Xóa video</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <p th:if="${#lists.isEmpty(videos)}" class="muted">Chưa có video. Thêm đường dẫn ở biểu mẫu phía trên.</p>
    </section>
</main>
</body>
</html>
