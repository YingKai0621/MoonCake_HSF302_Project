<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('Đơn hàng')}"></head>
<body class="page-orders">
<header th:replace="~{admin/layout :: nav}"></header>
<main>
    <div th:replace="~{admin/layout :: flash}"></div>

    <div class="page-heading page-heading--simple">
        <h1>Đơn hàng</h1>
    </div>

    <nav class="tabs" aria-label="Lọc theo trạng thái" data-tabs>
        <a th:each="tab : ${tabs}"
           class="tabs__item"
           th:classappend="${tab.selected} ? 'is-active'"
           th:attr="aria-current=${tab.selected ? 'page' : null}"
           th:href="${tab.status == null} ? @{/admin/orders} : @{/admin/orders(status=${tab.status})}">
            <span th:text="${tab.label}">Tất cả</span>
            <span class="tabs__count" th:text="${tab.count}">0</span>
        </a>
    </nav>

    <section class="table-scroll">
        <table data-search-table>
            <thead>
            <tr>
                <th>Mã đơn</th>
                <th>Người nhận</th>
                <th>Trạng thái</th>
                <th>Thanh toán</th>
                <th class="numeric">Tổng tiền</th>
                <th>Đặt lúc</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td><a th:href="@{/admin/orders/{id}(id=${order.id})}" th:text="${order.code}">MC-1</a></td>
                <td th:text="${order.recipient}">Người nhận</td>
                <td>
                    <span class="badge" th:classappend="${'badge--' + order.statusTone}" th:text="${order.statusLabel}">Chờ xử lý</span>
                    <span th:if="${order.actions.needsRefund}" class="badge badge--danger">Cần hoàn tiền</span>
                </td>
                <td>
                    <th:block th:each="payment : ${order.payments}">
                        <span th:text="${payment.methodLabel}">COD</span>
                        <span class="muted" th:text="${' · ' + payment.statusLabel}"> · Chưa thanh toán</span>
                    </th:block>
                </td>
                <td class="numeric" th:text="${#numbers.formatDecimal(order.total, 0, 'POINT', 0, 'COMMA') + 'đ'}">0đ</td>
                <td class="muted" th:text="${order.formattedCreatedAt}">01/01/2026 10:00</td>
            </tr>
            </tbody>
        </table>
        <div th:if="${orders.isEmpty()}" class="empty-state">
            <p><strong>Không có đơn nào ở trạng thái này.</strong></p>
            <a th:href="@{/admin/orders}">Xem tất cả đơn hàng</a>
        </div>
    </section>

    <div class="pager" th:if="${page > 0 or orders.size() == 50}">
        <a th:if="${page > 0}" class="button secondary" th:href="@{/admin/orders(page=${page - 1},status=${status})}">← Trang trước</a>
        <a th:if="${orders.size() == 50}" class="button secondary" th:href="@{/admin/orders(page=${page + 1},status=${status})}">Trang sau →</a>
    </div>
</main>
</body>
</html>
