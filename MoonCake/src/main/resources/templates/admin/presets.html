<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('Công thức hộp PRESET')}"></head>
<body class="page-presets">
<header th:replace="~{admin/layout :: nav}"></header>
<main>
    <div th:replace="~{admin/layout :: flash}"></div>
    <div class="page-heading page-heading--simple"><span class="eyebrow">Sản phẩm</span><h1>Công thức hộp quà</h1></div>
    <section><h2>Tạo công thức nháp</h2>
        <form th:action="@{/admin/presets}" method="post">
            <div class="grid"><label>SKU GIFT_SET<select name="giftSetVariantId" required>
                <option value="">Chọn SKU hộp quà...</option>
                <option th:each="v : ${catalog.giftVariants()}" th:value="${v.id}"
                        th:text="${v.sku + ' — ' + v.name}"></option>
            </select></label><label>Mẫu hộp<select name="boxId" required>
                <option th:each="b : ${catalog.boxes}" th:value="${b.id}"
                        th:text="${'Hộp #' + b.id + ' · SKU #' + b.variantId + ' · ' + b.capacityCakes + ' bánh'}"></option>
            </select></label></div>
            <div class="actions">
                <button>Tạo DRAFT</button>
            </div>
        </form>
    </section>
    <section th:each="p : ${presets}" th:id="${'preset-' + p.id}"><h2 th:text="${p.sku + ' · ' + p.status}"></h2>
        <p>Sức chứa: <strong th:text="${p.capacity}"></strong> bánh</p>
        <ul>
            <li th:each="c : ${p.components}" th:text="${c.sku + ' × ' + c.quantity}"></li>
        </ul>
        <div th:if="${p.status.name() == 'DRAFT'}">
            <details>
                <summary>Đổi mẫu hộp</summary>
                <form th:action="@{/admin/presets}" method="post"><input type="hidden" name="id"
                                                                         th:value="${p.id}"><input type="hidden"
                                                                                                   name="giftSetVariantId"
                                                                                                   th:value="${p.giftSetVariantId}"><label>Mẫu
                    hộp<select name="boxId">
                        <option th:each="b : ${catalog.boxes}" th:value="${b.id}" th:selected="${b.id == p.boxId}"
                                th:text="${'Hộp #' + b.id + ' · ' + b.capacityCakes + ' bánh'}"></option>
                    </select></label>
                    <button>Lưu mẫu hộp</button>
                </form>
            </details>
            <form th:action="@{/admin/presets/{id}/components(id=${p.id})}" method="post">
                <div class="grid"><label>SKU bánh MOONCAKE<select name="variantId" required>
                    <option th:each="v : ${catalog.cakeVariants()}" th:value="${v.id}"
                            th:text="${v.sku + ' — ' + v.name}"></option>
                </select></label><label>Số bánh mỗi hộp (0 để bỏ)<input type="number" name="quantity" required min="0"
                                                                        value="1"></label></div>
                <div class="actions">
                    <button>Lưu thành phần</button>
                </div>
            </form>
            <form th:action="@{/admin/presets/{id}/activate(id=${p.id})}" method="post" class="actions"><label><input
                    type="checkbox" required>Tôi đã kiểm tra công thức và muốn khóa thành phần</label>
                <button>Chuyển READY</button>
            </form>
        </div>
        <p th:unless="${p.status.name() == 'DRAFT'}" class="notice">Công thức đã khóa. Có thể đóng hộp ở mục Kho và mở
            bán SKU ở Catalog.</p></section>
</main>
</body>
</html>
