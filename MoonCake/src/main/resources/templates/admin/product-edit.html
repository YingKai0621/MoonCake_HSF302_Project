<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head('Sửa sản phẩm')}"></head>
<body class="page-catalog">
<header th:replace="~{admin/fragments/layout :: nav}"></header>
<main th:with="product=${page.detail.product},hideSaleSwitch=${true}">
    <div th:replace="~{admin/fragments/layout :: flash}"></div>

    <a class="back-link" th:href="@{/admin/catalog}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        Quay lại danh sách sản phẩm
    </a>
    <div class="detail-header">
        <div>
            <span class="eyebrow" th:text="${page.detail.typeLabel}">Hộp quà</span>
            <h1 th:text="${product.name}">Tên sản phẩm</h1>
        </div>
    </div>

    <section id="sale" class="sale-card" th:classappend="${product.active} ? 'is-on'">
        <div class="sale-card__info">
            <strong th:text="${product.active} ? 'Đang hiện trên cửa hàng' : 'Đang ẩn khỏi cửa hàng'">Đang ẩn khỏi cửa hàng</strong>
            <span th:if="${page.detail.webTone != 'success'}" class="badge badge--dot" th:classappend="${'badge--' + page.detail.webTone}" th:text="${page.detail.webLabel}">Đang ẩn</span>
        </div>
        <div class="sale-card__actions">
            <a th:if="${product.active}" class="button secondary" th:href="@{/products/{slug}(slug=${product.slug})}" target="_blank" rel="noopener">Xem trên cửa hàng</a>
            <form th:action="@{/admin/catalog/products/{id}/visibility(id=${product.id})}" method="post"
                  th:attr="data-confirm-message=${product.active ? 'Ẩn “' + product.name + '” khỏi cửa hàng? Khách sẽ không thấy và không đặt được sản phẩm này.' : null}">
                <input type="hidden" name="visible" th:value="${!product.active}">
                <button type="submit" th:classappend="${product.active} ? 'stop-sale'"
                        th:text="${product.active} ? 'Ẩn khỏi cửa hàng' : 'Hiện trên cửa hàng'">Hiện trên cửa hàng</button>
            </form>
        </div>
        <p th:replace="~{admin/fragments/product-forms :: alert('sale')}"></p>
    </section>

    <nav class="jump-links" aria-label="Đi tới phần">
        <a href="#info">Thông tin</a>
        <a href="#skus" th:text="${'Phiên bản & giá (' + #lists.size(page.detail.skus) + ')'}">Phiên bản &amp; giá</a>
    </nav>

    <section id="info">
        <h2>Thông tin sản phẩm</h2>
        <p th:replace="~{admin/fragments/product-forms :: alert('info')}"></p>
        <form th:replace="~{admin/fragments/product-forms :: product(${formTarget == 'info' ? formValues : product}, ${page.detail.typeLocked})}"></form>
    </section>

    <section id="skus">
        <div class="section-heading">
            <div>
                <h2>Phiên bản &amp; giá</h2>
            </div>
        </div>


        <div class="sku-list">
            <details th:each="sku, stat : ${page.detail.skus}" class="sku-card" th:id="${'sku-' + sku.form.id}"
                     th:open="${stat.index == 0 or formTarget == 'sku-' + sku.form.id}">
                <summary class="sku-card__summary">
                    <span class="product-thumb">
                        <img th:if="${sku.imageUrl != null}" th:src="${sku.imageUrl}" alt="" loading="lazy" width="48" height="48">
                    </span>
                    <span class="sku-card__title">
                        <strong th:text="${sku.form.name}">Hộp 4 bánh</strong>
                        <code th:text="${sku.form.sku}">SKU</code>
                        <small class="muted" th:if="${sku.form.capacityCakes != null}" th:text="${sku.form.capacityCakes + ' bánh / hộp'}">4 bánh / hộp</small>
                    </span>
                    <span class="sku-card__price" th:text="${#numbers.formatDecimal(sku.form.unitPrice, 0, 'POINT', 0, 'COMMA') + 'đ'}">0đ</span>
                    <span class="sku-card__stock" th:text="${'Kho: ' + sku.stock}">Kho: 0</span>
                    <span class="sku-card__batch muted" th:if="${sku.currentBatch}" th:text="${'Lô đang bán: ' + sku.currentBatch}">Lô đang bán</span>
                    <span class="badge badge--dot" th:classappend="${'badge--' + sku.webTone}"
                          th:text="${sku.webLabel}">Đang bán trên web</span>
                </summary>

                <div class="sku-card__body">
                    <div class="sku-tools">
                        <a class="button secondary small-button" th:href="@{/admin/inventory(receive=${sku.form.id},returnProduct=${product.id})}">Nhập kho</a>
                        <form th:action="@{/admin/variants/{id}/sale(id=${sku.form.id})}" method="post"
                              th:attr="data-confirm-message=${sku.form.active ? 'Ngừng bán phiên bản “' + sku.form.name + '”?' : null}">
                            <input type="hidden" name="productId" th:value="${product.id}">
                            <input type="hidden" name="onSale" th:value="${!sku.form.active}">
                            <button type="submit" class="small-button" th:classappend="${sku.form.active} ? 'stop-sale' : ''"
                                    th:text="${sku.form.active} ? 'Ngừng bán phiên bản' : 'Mở bán phiên bản'">Mở bán phiên bản</button>
                        </form>
                    </div>
                    <p th:replace="~{admin/fragments/product-forms :: alert(${'sku-' + sku.form.id})}"></p>
                    <form th:replace="~{admin/fragments/product-forms :: sku(${formTarget == 'sku-' + sku.form.id ? formValues : sku.form}, ${product.id})}"></form>

                    <div th:replace="~{admin/fragments/product-forms :: imageManager(${sku}, ${product.id})}"></div>

                    <div class="sku-delete">
                        <form th:if="${sku.deleteBlocker == null}"
                              th:action="@{/admin/variants/{id}/delete(id=${sku.form.id},productId=${product.id})}"
                              th:attr="data-confirm-message=${'Xóa phiên bản “' + sku.form.name + '” cùng ảnh của nó? Không thể hoàn tác.'}"
                              method="post">
                            <button type="submit" class="danger small-button">Xóa phiên bản</button>
                        </form>
                        <p th:if="${sku.deleteBlocker != null}" class="delete-blocker" th:text="${sku.deleteBlocker}">Không xóa được.</p>
                    </div>
                </div>
            </details>

            <details class="sku-card sku-card--new" id="sku-new" th:open="${page.detail.skus.isEmpty() or formTarget == 'sku-new'}">
                <summary class="sku-card__summary">
                    <span class="sku-card__plus" aria-hidden="true">+</span>
                    <strong>Thêm phiên bản mới</strong>
                </summary>
                <div class="sku-card__body">
                    <p th:replace="~{admin/fragments/product-forms :: alert('sku-new')}"></p>
                    <form th:replace="~{admin/fragments/product-forms :: sku(${formTarget == 'sku-new' ? formValues : null}, ${product.id})}"></form>
                </div>
            </details>
        </div>
    </section>

    <div id="danger" class="delete-row">
        <p th:replace="~{admin/fragments/product-forms :: alert('danger')}"></p>
        <form th:if="${page.detail.deleteBlocker == null}"
              th:action="@{/admin/catalog/products/{id}/delete(id=${product.id})}"
              th:attr="data-confirm-message=${'Xóa vĩnh viễn sản phẩm “' + product.name + '” cùng mọi phiên bản và ảnh? Không thể hoàn tác.'}"
              method="post">
            <button type="submit" class="danger small-button">Xóa sản phẩm</button>
        </form>
        <p th:if="${page.detail.deleteBlocker != null}" class="delete-blocker" th:text="${page.detail.deleteBlocker}">Không xóa được.</p>
    </div>
</main>
<script th:src="@{/js/pages/admin-product.js}" defer></script>
<script th:src="@{/js/pages/admin-modal.js}" defer></script>
<script th:src="@{/js/loading-button.js}" defer></script>
</body>
</html>
