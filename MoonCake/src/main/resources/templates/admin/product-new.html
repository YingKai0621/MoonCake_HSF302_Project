<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head(${page.formOptions.giftBox ? 'Thêm hộp quà' : 'Thêm sản phẩm'})}"></head>
<body class="page-catalog">
<header th:replace="~{admin/fragments/layout :: nav}"></header>
<main>
    <div th:replace="~{admin/fragments/layout :: flash}"></div>

    <a class="back-link" th:href="${page.formOptions.giftBox} ? @{/admin/gift-boxes} : @{/admin/catalog}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        <span th:text="${page.formOptions.giftBox ? 'Quay lại danh sách hộp quà' : 'Quay lại danh sách sản phẩm'}">Quay lại</span>
    </a>
    <div class="page-heading page-heading--simple">
        <span class="eyebrow" th:text="${page.formOptions.giftBox ? 'Hộp quà' : 'Sản phẩm'}">Sản phẩm</span>
        <h1 th:text="${page.formOptions.giftBox ? 'Thêm hộp quà' : 'Thêm sản phẩm'}">Thêm sản phẩm</h1>
    </div>

    <p th:replace="~{admin/fragments/product-forms :: alert('new-product')}"></p>
    <form th:action="@{/admin/catalog/products}" method="post" enctype="multipart/form-data" class="create-layout"
          th:with="values=${formTarget == 'new-product' ? formValues : null}">
        <div class="create-layout__main">
            <section>
                <h2>Thông tin chung</h2>
                <div th:replace="~{admin/fragments/product-forms :: productFields(${values}, false)}"></div>
            </section>

            <section th:if="${page.formOptions.giftBox}">
                <h2>Chọn vỏ hộp</h2>
                <div class="pick-grid" th:unless="${page.boxes.isEmpty()}">
                    <label th:each="box : ${page.boxes}" class="pick-card">
                        <input type="radio" name="boxId" th:value="${box.id}" required
                               th:checked="${selectedBoxId != null and selectedBoxId == box.id}">
                        <span class="pick-card__image">
                            <img th:if="${box.imageUrl != null}" th:src="${box.imageUrl}" alt="" loading="lazy">
                        </span>
                        <span class="pick-card__text">
                            <strong th:text="${box.label}">Vỏ hộp Kim Phúc</strong>
                            <small th:text="${box.detail + ' / hộp · Kho: ' + box.stock + ' vỏ'}">4 bánh / hộp · Kho: 98 vỏ</small>
                        </span>
                    </label>
                </div>
                <div class="empty-state" th:if="${page.boxes.isEmpty()}">
                    <p><strong>Chưa có hộp rỗng nào có sức chứa.</strong></p>
                    <a class="button secondary" th:href="@{/admin/catalog/products/new}">Thêm hộp rỗng</a>
                </div>
            </section>
        </div>

        <aside class="create-layout__side">
            <section>
                <h2 th:text="${page.formOptions.giftBox ? 'Giá bán' : 'Tạo phiên bản'}">Tạo phiên bản</h2>
                <div class="side-fields">
                    <input th:if="${page.formOptions.giftBox}" type="hidden" name="variantName" value="Hộp quà">
                    <label th:unless="${page.formOptions.giftBox}">Tên phiên bản
                        <input type="text" name="variantName" required maxlength="200" placeholder="Ví dụ: Hộp 4 bánh"
                               th:value="${values != null ? values.variantName : ''}">
                    </label>
                    <label>Giá bán (đ)
                        <input type="number" name="unitPrice" placeholder="Ví dụ: 450000"
                               th:value="${values != null ? values.unitPrice : ''}"
                               required min="1000" max="100000000" step="1000" data-min-error="Giá bán thấp nhất là 1.000đ." data-step-error="Giá bán phải là bội số của 1.000đ, ví dụ 450000.">
                    </label>
                    <th:block th:unless="${page.formOptions.giftBox}">
                    <label>Mã SKU
                        <input type="text" name="sku" required maxlength="80" placeholder="Ví dụ: GIFT-4-TRANG"
                               th:value="${values != null ? values.sku : ''}"
                               pattern="[A-Za-z0-9]+([\-_][A-Za-z0-9]+)*" data-uppercase data-error="Mã SKU chỉ dùng chữ không dấu, số và dấu gạch ngang, ví dụ: GIFT-4-TRANG.">
                    </label>
                    </th:block>
                    <details th:if="${page.formOptions.giftBox}" class="url-option" th:open="${values != null}">
                        <summary>Nâng cao: mã SKU</summary>
                        <label>Mã SKU
                        <input type="text" name="sku" required data-sku-auto maxlength="80" placeholder="Ví dụ: GIFT-4-TRANG"
                               th:value="${values != null ? values.sku : ''}"
                               pattern="[A-Za-z0-9]+([\-_][A-Za-z0-9]+)*" data-uppercase data-error="Mã SKU chỉ dùng chữ không dấu, số và dấu gạch ngang, ví dụ: GIFT-4-TRANG.">
                    </label>
                    </details>
                    <label data-only-type="MOONCAKE" hidden>Khối lượng (g)
                        <input type="number" name="weightGrams" placeholder="Ví dụ: 150" required disabled
                               th:value="${values != null ? values.weightGrams : ''}" min="1" max="5000" data-max-error="Khối lượng tối đa 5.000g.">
                    </label>
                    <label data-only-type="MOONCAKE" hidden>Nhân bánh
                        <input type="text" name="fillingLabel" maxlength="180" placeholder="Ví dụ: Thập cẩm lạp xưởng" required disabled
                               th:value="${values != null ? values.fillingLabel : ''}">
                    </label>
                    <label data-only-type="EMPTY_BOX" hidden>Sức chứa (số bánh)
                        <input type="number" name="capacityCakes" placeholder="Ví dụ: 4" required disabled
                               th:value="${values != null ? values.capacityCakes : ''}" min="1" max="24" data-max-error="Sức chứa tối đa 24 bánh.">
                    </label>
                    <label data-only-type="EMPTY_BOX" hidden>Chất liệu
                        <input type="text" name="material" maxlength="180" placeholder="Ví dụ: Giấy kraft" disabled
                               th:value="${values != null ? values.material : ''}">
                    </label>
                </div>
            </section>

            <section>
                <h2>Ảnh đại diện</h2>
                <label th:replace="~{admin/fragments/product-forms :: dropzone(false)}"></label>
                <details class="url-option">
                    <summary>Hoặc dán đường dẫn ảnh có sẵn</summary>
                    <input type="text" name="imageUrl" maxlength="1000" pattern="(https?://\S+|/images/\S+|/uploads/\S+)" data-error="Đường dẫn phải bắt đầu bằng https://, /images/ hoặc /uploads/."
                           placeholder="https://... hoặc /images/products/..." aria-label="Đường dẫn ảnh">
                </details>
            </section>

            <section class="create-layout__submit">
                <input th:if="${page.formOptions.giftBox}" type="hidden" name="active" value="false">
                <label class="switch-card" th:unless="${page.formOptions.giftBox}">
                    <input type="hidden" name="_active" value="on">
                    <input type="checkbox" class="switch" name="active" value="true" th:checked="${values != null and values.active}">
                    <span class="switch-card__text">
                        <strong>Hiển thị trên cửa hàng ngay</strong>
                    </span>
                </label>
                <button type="submit" data-loading-text="Đang tạo…"
                        th:text="${page.formOptions.giftBox ? 'Tạo hộp quà' : 'Tạo sản phẩm'}" th:disabled="${page.formOptions.giftBox and page.boxes.isEmpty()}">Tạo sản phẩm</button>
            </section>
        </aside>
    </form>
</main>
<script th:src="@{/js/pages/admin-product.js}" defer></script>
<script th:src="@{/js/loading-button.js}" defer></script>
</body>
</html>
