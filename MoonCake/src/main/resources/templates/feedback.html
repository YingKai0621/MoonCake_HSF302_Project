<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Góp ý | MoonCake</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" th:href="@{/css/pages/admin.css}"><link rel="stylesheet" th:href="@{/css/header.css}"><link rel="stylesheet" th:href="@{/css/global.css}"></head><body><header th:replace="~{fragments/header :: header('feedback')}"></header><main><div class="page-heading"><h1>Góp ý cho MoonCake</h1><p>Chia sẻ trải nghiệm hoặc điều bạn muốn cửa hàng cải thiện.</p></div><p class="notice" th:if="${successMessage}" th:text="${successMessage}"></p><p th:if="${errorMessage}" class="error" role="alert" th:text="${errorMessage}"></p><section><form th:action="@{/feedback}" method="post"><label>Nội dung góp ý<textarea name="content" th:text="${content}" required maxlength="2000" rows="6" placeholder="Nhập góp ý của bạn…"></textarea></label><div class="actions"><button>Gửi góp ý</button></div></form></section></main></body></html>
