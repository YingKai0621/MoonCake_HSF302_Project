<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

  <header th:fragment="header(activePage)" class="site-header" data-site-header>
    <div class="site-header__inner">
      <a class="site-header__brand" th:href="@{/}" href="/" aria-label="MoonCake - Trang chủ">
        <img class="site-header__logo"
             th:src="@{/images/branding/mooncake_luxury_emblem_v4.svg}"
             src="/images/branding/mooncake_luxury_emblem_v4.svg"
             width="68"
             height="68"
             alt="">
        <span class="site-header__brand-name">MoonCake</span>
      </a>

      <div id="site-header-panel" class="site-header__panel" data-header-panel>
        <nav class="site-header__nav" aria-label="Điều hướng chính">
          <a class="site-header__nav-link"
             th:classappend="${activePage == 'home'} ? ' site-header__nav-link--active'"
             th:attr="aria-current=${activePage == 'home'} ? 'page'"
             th:href="@{/}"
             href="/">Trang chủ</a>

          <details class="site-header__dropdown" data-header-dropdown>
            <summary class="site-header__nav-link"
                     th:classappend="${activePage == 'products' or activePage == 'custom-box'} ? ' site-header__nav-link--active'">
              <span>Sản phẩm</span>
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="m7 10 5 5 5-5"></path>
              </svg>
            </summary>
            <div class="site-header__dropdown-menu">
              <a th:href="@{/products/gift-boxes}" href="/products/gift-boxes">Hộp quà Trung Thu</a>
              <a th:href="@{/products/mooncakes}" href="/products/mooncakes">Bánh Trung Thu</a>
              <a th:href="@{/custom-boxes}" href="/custom-boxes">Tự chọn hộp quà</a>
            </div>
          </details>

          <a class="site-header__nav-link"
             th:classappend="${activePage == 'business'} ? ' site-header__nav-link--active'"
             th:attr="aria-current=${activePage == 'business'} ? 'page'"
             th:href="@{/business}"
             href="/business">Doanh nghiệp</a>

          <a class="site-header__nav-link" th:href="@{/#footer}" href="/#footer">Liên hệ</a>
        </nav>

        <div class="site-header__account">
          <div th:unless="${loggedIn}" class="site-header__auth-links">
            <a th:href="@{/login}" href="/login">Đăng nhập</a>
            <a class="site-header__register" th:href="@{/register}" href="/register">Đăng ký</a>
          </div>

          <details th:if="${loggedIn}" class="site-header__dropdown site-header__user" data-header-dropdown>
            <summary class="site-header__user-trigger" aria-label="Mở menu tài khoản">
              <span class="site-header__user-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M20 21a8 8 0 0 0-16 0"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </span>
              <span>Tài khoản</span>
              <svg class="site-header__chevron" aria-hidden="true" viewBox="0 0 24 24">
                <path d="m7 10 5 5 5-5"></path>
              </svg>
            </summary>
            <div class="site-header__dropdown-menu site-header__account-menu">
              <p class="site-header__email" th:text="${currentUserEmail}">customer@example.com</p>
              <a th:if="${customerLoggedIn}" th:href="@{/orders}" href="/orders">Đơn hàng của tôi</a>
              <a th:unless="${customerLoggedIn}" th:href="@{/admin}" href="/admin">Trang quản trị</a>
              <form class="site-header__logout" th:action="@{/logout}" action="/logout" method="post">
                <button type="submit">Đăng xuất</button>
              </form>
            </div>
          </details>
        </div>
      </div>

      <a th:if="${!loggedIn or customerLoggedIn}"
         class="site-header__cart"
         th:classappend="${activePage == 'cart' or activePage == 'checkout' or activePage == 'order-success'} ? ' site-header__cart--active'"
         th:href="@{/cart}"
         href="/cart"
         aria-label="Mở giỏ hàng">
        <span class="site-header__cart-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M16 11V7a4 4 0 0 0-8 0v4M5 9h14l1 12H4L5 9Z"></path>
          </svg>
          <span id="headerCartBadge" class="site-header__cart-badge">
            <span th:text="${headerCartQuantity}">0</span>
          </span>
        </span>
        <span class="site-header__cart-label">Giỏ hàng</span>
      </a>

      <button class="site-header__menu-button"
              type="button"
              aria-label="Mở menu"
              aria-controls="site-header-panel"
              aria-expanded="false"
              data-header-menu-toggle>
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <script th:src="@{/js/header.js}" src="/js/header.js" defer></script>
  </header>

</body>
</html>
