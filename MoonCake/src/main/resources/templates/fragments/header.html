<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

  <!-- ================= APPROVED GLOBAL HEADER V4 (LUXURY EMBLEM INTEGRATION) ================= -->
  <header th:fragment="header(activePage)" class="w-full bg-[#10233D] relative border-b border-[#FAF4A9]/30 shadow-2xl sticky top-0 z-50 select-none">
    
    <!-- ROW 1: BRAND NAVIGATION (Height 88px, Midnight Navy #10233D) -->
    <div class="border-b border-[#FAF4A9]/20 relative">
      <div class="max-w-[1380px] mx-auto px-8 lg:px-12 h-[88px] grid grid-cols-[1fr_auto_1fr] items-center">
        
        <!-- LEFT MENU GROUP (Trang Chủ & Sản Phẩm) -->
        <nav class="flex items-center justify-end pr-8 lg:pr-14 gap-10 lg:gap-14 font-serif text-[22px] font-semibold tracking-wide">
          <a th:href="@{/}" th:classappend="${activePage == 'home'} ? 'text-[#FAF4A9] hover:text-[#FFFDF0]' : 'text-[#FAF4A9]/90 hover:text-[#FFFDF0]'" class="relative py-2 transition-colors group flex items-center">
            <span>Trang Chủ</span>
            <span th:if="${activePage == 'home'}" class="absolute -bottom-1.5 left-0 right-0 h-[3px] bg-gradient-to-r from-[#FAF4A9] via-[#FAF4A9] to-[#E7D97F] rounded-full shadow-[0_0_8px_rgba(250,244,169,0.55)]"></span>
            <span th:unless="${activePage == 'home'}" class="absolute -bottom-1.5 left-0 w-0 group-hover:w-full h-[2px] bg-[#FAF4A9]/80 rounded-full transition-all duration-300"></span>
          </a>
          <div class="relative group py-2">
            <a th:href="@{/products}" th:classappend="${activePage == 'products'} ? 'text-[#FAF4A9] hover:text-[#FFFDF0]' : 'text-[#FAF4A9]/90 hover:text-[#FFFDF0]'" class="relative flex items-center gap-2 transition-colors py-1">
              <span>Sản Phẩm</span>
              <svg class="w-4 h-4 text-[#FAF4A9]/80 group-hover:text-[#FFFDF0] group-hover:rotate-180 transition-transform duration-250" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" />
              </svg>
              <span th:if="${activePage == 'products'}" class="absolute -bottom-1.5 left-0 right-0 h-[3px] bg-gradient-to-r from-[#FAF4A9] via-[#FAF4A9] to-[#E7D97F] rounded-full shadow-[0_0_8px_rgba(250,244,169,0.55)]"></span>
              <span th:unless="${activePage == 'products'}" class="absolute -bottom-1.5 left-0 w-0 group-hover:w-full h-[2px] bg-[#FAF4A9]/80 rounded-full transition-all duration-300"></span>
            </a>
            <!-- Dropdown Menu -->
            <div class="absolute left-0 top-full pt-2 opacity-0 pointer-events-none group-hover:opacity-100 group-hover:pointer-events-auto transition-all duration-200 z-50">
              <div class="bg-[#10233D] border border-[#FAF4A9]/30 rounded-xl shadow-2xl py-2 w-56 text-[15px] font-sans font-medium backdrop-blur-md">
                <a th:href="@{/products}" class="block px-5 py-2.5 text-[#FAF4A9]/90 hover:text-[#FFFDF0] hover:bg-[#162842] transition-colors">
                  Hộp Quà Trung Thu
                </a>
                <a th:href="@{/products#banh-le}" class="block px-5 py-2.5 text-[#FAF4A9]/90 hover:text-[#FFFDF0] hover:bg-[#162842] transition-colors border-t border-[#FAF4A9]/10">
                  Bánh Lẻ Hảo Hạng
                </a>
                <a th:href="@{/products}" class="block px-5 py-2.5 text-[#E7D97F] hover:text-[#FFFDF0] hover:bg-[#162842] transition-colors border-t border-[#FAF4A9]/10 font-semibold">
                  Xem Tất Cả Sản Phẩm →
                </a>
              </div>
            </div>
          </div>
        </nav>

        <!-- CENTER: RESERVED GAP FOR OVERLAPPING EMBLEM (130px) -->
        <div class="w-[130px] flex items-center justify-center relative">
          <!-- Geometric spacer to prevent menu overlap -->
        </div>

        <!-- RIGHT MENU GROUP (Doanh Nghiệp & Liên Hệ) -->
        <nav class="flex items-center justify-start pl-8 lg:pl-14 gap-10 lg:gap-14 font-serif text-[22px] font-semibold tracking-wide">
          <a href="javascript:void(0)" title="Dịch vụ Doanh Nghiệp (Đang cập nhật)" class="relative py-2 text-[#FAF4A9]/90 hover:text-[#FFFDF0] transition-colors group flex items-center cursor-default">
            <span>Doanh Nghiệp</span>
            <span class="absolute -bottom-1.5 left-0 w-0 group-hover:w-full h-[2px] bg-[#FAF4A9]/80 rounded-full transition-all duration-300"></span>
          </a>
          <a th:href="@{/#footer}" href="#footer" class="relative py-2 text-[#FAF4A9]/90 hover:text-[#FFFDF0] transition-colors group flex items-center">
            <span>Liên Hệ</span>
            <span class="absolute -bottom-1.5 left-0 w-0 group-hover:w-full h-[2px] bg-[#FAF4A9]/80 rounded-full transition-all duration-300"></span>
          </a>
        </nav>

      </div>
    </div>

    <!-- ROW 2: UTILITY ROW (Height 54px, Midnight Navy #0C1626) -->
    <div class="bg-[#0C1626]">
      <div class="max-w-[1380px] mx-auto px-8 lg:px-12 h-[54px] flex items-center justify-between">
        
        <!-- Left: Search Field (360px, High Contrast Ivory) -->
        <div class="relative w-[360px]">
          <input 
            type="text" 
            placeholder="Tìm kiếm vị bánh, hộp quà cao cấp..." 
            class="w-full bg-[#FAF6EE] text-[13.5px] font-medium text-[#0C1626] placeholder-[#64748B] pl-11 pr-4 py-2 rounded-full border border-[#FAF4A9]/70 shadow-[0_2px_8px_rgba(0,0,0,0.25)] focus:outline-none focus:ring-1 focus:ring-[#FAF4A9] transition-all header-search-input"
          />
          <svg class="w-[18px] h-[18px] text-[#0C1626] absolute left-4 top-2.5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>

        <!-- Center: Reserved Gap for Emblem Overlap (130px) -->
        <div class="w-[130px]"></div>

        <!-- Right: Shopping Cart Link -->
        <a th:href="@{/cart}" class="flex items-center gap-3 px-4 py-1.5 rounded-full bg-[#162842]/70 border border-[#FAF4A9]/35 text-[#FAF4A9] hover:bg-[#162842] hover:border-[#FAF4A9]/60 transition-colors shadow-sm cursor-pointer group">
          <div class="relative flex items-center justify-center">
            <svg class="w-6 h-6 text-[#FAF4A9] group-hover:scale-105 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
            </svg>
            <span id="headerCartBadge" class="absolute -top-1.5 -right-2.5 bg-[#FAF4A9] text-[#0C1626] font-bold text-[11px] w-5 h-5 rounded-full flex items-center justify-center shadow-md border border-[#0C1626]">
              2
            </span>
          </div>
          <span class="font-serif text-[16px] font-semibold tracking-wide">
            Giỏ hàng
          </span>
        </a>

      </div>
    </div>

    <!-- ================= OVERLAPPING EMBLEM (EXACTLY 115px) ================= -->
    <div class="absolute left-1/2 top-[82px] -translate-x-1/2 -translate-y-1/2 z-30 pointer-events-auto">
      <a th:href="@{/}" class="block w-[115px] h-[115px] hover:scale-105 transition-transform duration-300 drop-shadow-[0_8px_20px_rgba(0,0,0,0.65)]" title="MoonCake - Về trang chủ">
        <img th:src="@{/images/branding/mooncake_luxury_emblem_v4.svg}"
             src="/images/branding/mooncake_luxury_emblem_v4.svg"
             alt="MoonCake"
             width="115"
             height="115"
             class="w-[115px] h-[115px] object-contain">
      </a>
    </div>

  </header>

</body>
</html>
