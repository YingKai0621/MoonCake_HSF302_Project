<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoonCake — Đơn hàng của tôi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            midnight: '#10233D', surface: '#0C1626', control: '#162842',
            gold: '#D1A85A', goldHover: '#E5C37E', ivory: '#F8F4EB', sand: '#C2BAAB'
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['"Be Vietnam Pro"', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" th:href="@{/css/global.css}" href="/css/global.css">
  <link rel="stylesheet" th:href="@{/css/header.css}" href="/css/header.css">
  <link rel="stylesheet" th:href="@{/css/components.css}" href="/css/components.css">
</head>
<body class="min-h-screen flex flex-col justify-between">
  <header th:replace="~{fragments/header :: header('orders')}"></header>

  <main class="flex-grow max-w-[1100px] w-full mx-auto px-4 sm:px-6 py-10">
    <div class="flex items-end justify-between gap-4 mb-8">
      <div>
        <p class="text-xs uppercase tracking-[0.2em] text-gold mb-2">Tài khoản của bạn</p>
        <h1 class="font-serif text-3xl md:text-4xl font-bold">Đơn hàng của tôi</h1>
      </div>
      <a th:href="@{/products}" class="text-sm text-sand hover:text-gold transition-colors">
        Tiếp tục mua sắm
      </a>
    </div>

    <section th:if="${#lists.isEmpty(orders)}"
             class="max-w-2xl mx-auto bg-surface border border-gold/20 rounded-lg p-10 text-center">
      <div class="w-14 h-14 mx-auto mb-5 rounded-full border border-gold/30 bg-control flex items-center justify-center text-gold">
        <span class="material-symbols-outlined text-3xl">receipt_long</span>
      </div>
      <h2 class="font-serif text-2xl font-semibold mb-3">Bạn chưa có đơn hàng nào</h2>
      <p class="text-sm text-sand mb-6">Các đơn hàng đã đặt sẽ được lưu và hiển thị tại đây.</p>
      <a th:href="@{/products}"
         class="inline-block px-7 py-3 bg-gold hover:bg-goldHover text-surface font-bold text-sm transition-colors">
        Khám phá sản phẩm
      </a>
    </section>

    <section th:unless="${#lists.isEmpty(orders)}" class="space-y-4">
      <article th:each="order : ${orders}"
               class="bg-surface border border-gold/20 rounded-lg p-5 sm:p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-5">
        <div class="space-y-2">
          <div class="flex flex-wrap items-center gap-3">
            <h2 class="font-mono font-semibold text-gold" th:text="${order.orderCode}">MC-00000000-00000000</h2>
            <span class="px-3 py-1 text-xs text-gold bg-gold/10 border border-gold/30 rounded"
                  th:text="${order.statusLabel}">Đã tiếp nhận</span>
          </div>
          <p class="text-sm text-sand" th:text="${'Đặt lúc ' + order.formattedCreatedAt}">Đặt lúc 21/10/2026 20:00</p>
        </div>

        <div class="flex items-center justify-between sm:justify-end gap-6">
          <div class="text-right">
            <p class="text-xs text-sand mb-1">Tổng cộng</p>
            <p class="text-lg font-bold text-gold" th:text="${order.formattedTotal}">0đ</p>
          </div>
          <a th:href="@{/orders/{orderCode}(orderCode=${order.orderCode})}"
             class="px-5 py-2.5 border border-gold/40 text-gold hover:border-gold transition-colors text-sm font-semibold">
            Xem chi tiết
          </a>
        </div>
      </article>
    </section>
  </main>

  <footer th:replace="~{fragments/footer :: checkoutFooter}"></footer>
  <script th:src="@{/js/main.js}" src="/js/main.js"></script>
</body>
</html>
