<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | MoonCake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/global.css}" href="/css/global.css">
  <link rel="stylesheet" th:href="@{/css/header.css}" href="/css/header.css">
  <link rel="stylesheet" th:href="@{/css/pages/auth.css}" href="/css/pages/auth.css">
  <script th:src="@{/js/auth.js}" src="/js/auth.js" defer></script>
</head>
<body class="auth-page">
  <header th:replace="~{fragments/header :: header('login')}"></header>

  <main class="auth-main">
    <section class="auth-card auth-card--login" aria-labelledby="login-title">
      <div class="auth-heading">
        <p class="auth-eyebrow">TÀI KHOẢN KHÁCH HÀNG</p>
        <h1 id="login-title">Đăng nhập</h1>
        <p class="auth-description">Đăng nhập để quản lý giỏ hàng và theo dõi đơn hàng của bạn.</p>
      </div>

      <div th:if="${param.registered}"
           class="auth-message auth-message--success"
           role="status">
        Đăng ký thành công. Bạn có thể đăng nhập ngay bây giờ.
      </div>
      <div th:if="${param.error}"
           class="auth-message auth-message--error"
           role="alert">
        Email hoặc mật khẩu không đúng, hoặc tài khoản đã bị vô hiệu hóa.
      </div>
      <div th:if="${param.logout}"
           class="auth-message auth-message--success"
           role="status">
        Bạn đã đăng xuất thành công.
      </div>

      <form th:action="@{/login}" method="post" class="auth-form">
        <div class="auth-field">
          <label for="email">Email</label>
          <input id="email"
                 name="email"
                 type="email"
                 maxlength="254"
                 autocomplete="username"
                 placeholder="tenban@example.com"
                 required
                 autofocus>
        </div>

        <div class="auth-field">
          <label for="password">Mật khẩu</label>
          <div class="auth-password">
            <input id="password"
                   name="password"
                   type="password"
                   autocomplete="current-password"
                   required>
            <button type="button"
                    class="auth-password-toggle"
                    data-password-toggle
                    data-target="password"
                    data-password-name="mật khẩu"
                    aria-controls="password"
                    aria-label="Hiện mật khẩu">Hiện</button>
          </div>
        </div>

        <button type="submit" class="auth-submit">Đăng nhập</button>
      </form>

      <p class="auth-switch">
        Chưa có tài khoản?
        <a th:href="@{/register}" href="/register">Đăng ký ngay</a>
      </p>
    </section>
  </main>
</body>
</html>
