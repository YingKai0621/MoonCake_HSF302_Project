<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thông tin cá nhân | MoonCake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            midnight: '#10233D',
            surface: '#0C1626',
            gold: '#EDC565',
            ivory: '#F8F4EB',
            sand: '#D3CABB'
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['"Be Vietnam Pro"', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" th:href="@{/css/global.css}" href="/css/global.css">
  <link rel="stylesheet" th:href="@{/css/header.css}" href="/css/header.css">
  <link rel="stylesheet" th:href="@{/css/components.css}" href="/css/components.css">
</head>
<body class="min-h-screen flex flex-col bg-midnight text-ivory font-sans">
  <header th:replace="~{fragments/header :: header('profile')}"></header>

  <main class="flex-grow max-w-3xl w-full mx-auto px-4 sm:px-8 py-10 md:py-16">
    <a th:href="@{/}" href="/" class="inline-flex items-center gap-2 text-sm text-sand hover:text-gold mb-7">
      <span aria-hidden="true">←</span> Trang chủ
    </a>

    <div class="mb-8">
      <p class="text-xs uppercase tracking-[0.2em] text-gold mb-2">Tài khoản</p>
      <h1 class="font-serif text-3xl md:text-4xl font-semibold">Thông tin cá nhân</h1>
      <p class="mt-3 text-sand">Thông tin hồ sơ đang được dùng cho tài khoản MoonCake của bạn.</p>
    </div>

    <section class="bg-surface border border-gold/20 rounded-lg p-6 sm:p-8" aria-label="Thông tin hồ sơ">
      <dl class="divide-y divide-gold/15">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 py-5 first:pt-0">
          <dt class="text-sm text-sand">Họ và tên</dt>
          <dd class="sm:col-span-2 font-medium" th:text="${profile.fullName}">Nguyễn Văn A</dd>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 py-5">
          <dt class="text-sm text-sand">Email</dt>
          <dd class="sm:col-span-2 font-medium break-all" th:text="${profile.email}">customer@example.com</dd>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 py-5 last:pb-0">
          <dt class="text-sm text-sand">Số điện thoại</dt>
          <dd class="sm:col-span-2 font-medium" th:text="${profile.phone}">0901234567</dd>
        </div>
      </dl>
    </section>

    <div th:if="${successMessage}" class="mt-5 border border-emerald-400/40 bg-emerald-950/30 text-emerald-200 px-4 py-3" role="status" th:text="${successMessage}"></div>

    <section class="mt-6 bg-surface border border-gold/20 rounded-lg p-6 sm:p-8" aria-labelledby="edit-name-title">
      <h2 id="edit-name-title" class="font-serif text-xl font-semibold mb-5">Chỉnh sửa họ tên</h2>
      <form th:action="@{/profile/name}" th:object="${profileForm}" method="post" class="space-y-4">
        <label for="fullName" class="block text-sm text-sand">Họ và tên</label>
        <input id="fullName" type="text" th:field="*{fullName}" maxlength="160" autocomplete="name" required class="w-full border border-gold/25 bg-midnight px-4 py-3 text-ivory outline-none focus:border-gold">
        <p th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-sm text-red-300"></p>
        <button type="submit" class="bg-gold text-surface font-semibold px-5 py-3">Lưu họ tên</button>
      </form>
    </section>
  </main>

  <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
