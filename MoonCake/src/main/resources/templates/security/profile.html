<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thông tin cá nhân | MoonCake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            midnight: '#10233D',
            surface: '#0C1626',
            gold: '#EDC565',
            ivory: '#F8F4EB',
            sand: '#D3CABB'
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['"Be Vietnam Pro"', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" th:href="@{/css/global.css}" href="/css/global.css">
  <link rel="stylesheet" th:href="@{/css/header.css}" href="/css/header.css">
  <link rel="stylesheet" th:href="@{/css/components.css}" href="/css/components.css">
</head>
<body class="min-h-screen flex flex-col bg-midnight text-ivory font-sans">
  <header th:replace="~{fragments/header :: header('profile')}"></header>

  <main class="flex-grow max-w-6xl w-full mx-auto px-4 sm:px-8 py-10 md:py-16">
    <a th:href="@{/}" href="/" class="inline-flex items-center gap-2 text-sm text-sand hover:text-gold mb-7">
      <span aria-hidden="true">←</span> Trang chủ
    </a>

    <div class="mb-8">
      <p class="text-xs uppercase tracking-[0.2em] text-gold mb-2">Tài khoản</p>
      <h1 class="font-serif text-3xl md:text-4xl font-semibold">Thông tin cá nhân</h1>
    </div>

    <div th:if="${successMessage}" class="mb-6 border border-emerald-400/40 bg-emerald-950/30 text-emerald-200 px-4 py-3" role="status" th:text="${successMessage}"></div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-x-10 gap-y-8 items-stretch">
    <section class="lg:col-span-2 bg-surface border border-gold/20 rounded-lg p-6 sm:p-8" aria-labelledby="profile-details-title">
      <h2 id="profile-details-title" class="font-serif text-xl font-semibold mb-5">Thông tin hiện tại</h2>
      <dl class="divide-y divide-gold/15">
        <div class="grid grid-cols-1 sm:grid-cols-[180px_minmax(0,1fr)] gap-3 py-5 first:pt-0">
          <dt class="text-base sm:text-lg text-sand">Họ và tên</dt>
          <dd class="sm:col-span-1">
            <form th:action="@{/profile/name}" th:object="${profileForm}" method="post" class="flex flex-wrap items-center gap-3" data-profile-edit-form>
              <input id="fullName" type="text" th:field="*{fullName}" maxlength="160" autocomplete="name" required class="flex-1 min-w-56 border border-gold/25 bg-midnight px-4 py-3 text-base text-ivory outline-none focus:border-gold">
              <button type="submit" class="bg-gold text-surface text-base font-semibold px-5 py-3">Lưu</button>
              <button type="reset" class="border border-gold/40 text-base text-sand font-semibold px-5 py-3 hover:border-gold hover:text-ivory" data-profile-cancel hidden>Hủy chỉnh sửa</button>
              <p th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="w-full text-sm text-red-300"></p>
            </form>
          </dd>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-[180px_minmax(0,1fr)] gap-3 py-5">
          <dt class="text-base sm:text-lg text-sand">Email</dt>
          <dd class="sm:col-span-1">
            <form th:action="@{/profile/email}" th:object="${emailForm}" method="post" class="flex flex-wrap items-center gap-3" data-profile-edit-form>
              <input id="email" type="email" th:field="*{email}" maxlength="254" autocomplete="email" required class="flex-1 min-w-56 border border-gold/25 bg-midnight px-4 py-3 text-base text-ivory outline-none focus:border-gold">
              <button type="submit" class="bg-gold text-surface text-base font-semibold px-5 py-3">Lưu</button>
              <button type="reset" class="border border-gold/40 text-base text-sand font-semibold px-5 py-3 hover:border-gold hover:text-ivory" data-profile-cancel hidden>Hủy chỉnh sửa</button>
              <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="w-full text-sm text-red-300"></p>
            </form>
            <p class="mt-2 text-sm text-sand">Email mới sẽ là tên đăng nhập của bạn; sau khi lưu, hãy đăng nhập lại.</p>
          </dd>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-[180px_minmax(0,1fr)] gap-3 py-5 last:pb-0">
          <dt class="text-base sm:text-lg text-sand">Số điện thoại</dt>
          <dd class="sm:col-span-1">
            <form th:action="@{/profile/phone}" th:object="${phoneForm}" method="post" class="flex flex-wrap items-center gap-3" data-profile-edit-form>
              <input id="phone" type="tel" th:field="*{phone}" inputmode="numeric" autocomplete="tel" maxlength="10" required class="flex-1 min-w-56 border border-gold/25 bg-midnight px-4 py-3 text-base text-ivory outline-none focus:border-gold">
              <button type="submit" class="bg-gold text-surface text-base font-semibold px-5 py-3">Lưu</button>
              <button type="reset" class="border border-gold/40 text-base text-sand font-semibold px-5 py-3 hover:border-gold hover:text-ivory" data-profile-cancel hidden>Hủy chỉnh sửa</button>
              <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="w-full text-sm text-red-300"></p>
            </form>
            <p class="mt-2 text-sm text-sand">Số điện thoại gồm 10 chữ số và bắt đầu bằng 0.</p>
          </dd>
        </div>
      </dl>
    </section>

    </div>
  </main>

  <footer th:replace="~{fragments/footer :: footer}"></footer>
  <script th:src="@{/js/pages/profile-edit.js}" src="/js/pages/profile-edit.js" defer></script>
</body>
</html>
