<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Đặt lại mật khẩu | MoonCake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/global.css}" href="/css/global.css">
  <link rel="stylesheet" th:href="@{/css/header.css}" href="/css/header.css">
  <link rel="stylesheet" th:href="@{/css/pages/auth.css}" href="/css/pages/auth.css">
  <script th:src="@{/js/auth.js}" src="/js/auth.js" defer></script>
  <link rel="stylesheet" th:href="@{/css/form-validation.css}">
</head>
<body class="auth-page">
  <header th:replace="~{fragments/header :: header('login')}"></header>

  <main class="auth-main">
    <section class="auth-card auth-card--login" aria-labelledby="reset-title">
      <div class="auth-heading">
        <p class="auth-eyebrow">TÀI KHOẢN KHÁCH HÀNG</p>
        <h1 id="reset-title">Đặt lại mật khẩu</h1>
        <p class="auth-description" th:unless="${invalidToken}">Nhập mật khẩu mới cho tài khoản của bạn.</p>
      </div>

      <th:block th:if="${invalidToken}">
        <div class="auth-message auth-message--error" role="alert">
          Đường link đặt lại mật khẩu không hợp lệ, đã được sử dụng hoặc đã hết hạn.
        </div>
        <p class="auth-switch">
          <a th:href="@{/forgot-password}" href="/forgot-password">Yêu cầu link mới</a>
          ·
          <a th:href="@{/login}" href="/login">Quay lại đăng nhập</a>
        </p>
      </th:block>

      <form th:unless="${invalidToken}"
            th:action="@{/reset-password}"
            th:object="${resetPasswordForm}"
            method="post"
            class="auth-form">
        <input type="hidden" th:field="*{token}">

        <div class="auth-field"
             th:classappend="${#fields.hasErrors('password')} ? ' auth-field--invalid'">
          <label for="password">Mật khẩu mới</label>
          <div class="auth-password">
            <input id="password"
                   name="password"
                   type="password"
                   minlength="8"
                   maxlength="64"
                   autocomplete="new-password"
                   th:attr="aria-invalid=${#fields.hasErrors('password')},aria-describedby=${#fields.hasErrors('password')} ? 'password-help password-error' : 'password-help'"
                   required
                   autofocus>
            <button type="button"
                    class="auth-password-toggle"
                    data-password-toggle
                    data-target="password"
                    data-password-name="mật khẩu mới"
                    aria-controls="password"
                    aria-label="Hiện mật khẩu mới">Hiện</button>
          </div>
          <p id="password-help" class="auth-help">Từ 8 đến 64 ký tự.</p>
          <p id="password-error"
             class="auth-field-error"
             th:if="${#fields.hasErrors('password')}"
             th:errors="*{password}">Lỗi mật khẩu</p>
        </div>

        <div class="auth-field"
             th:classappend="${#fields.hasErrors('confirmPassword')} ? ' auth-field--invalid'">
          <label for="confirmPassword">Xác nhận mật khẩu mới</label>
          <div class="auth-password">
            <input id="confirmPassword"
                   name="confirmPassword"
                   type="password"
                   minlength="8"
                   maxlength="64"
                   autocomplete="new-password"
                   th:attr="aria-invalid=${#fields.hasErrors('confirmPassword')},aria-describedby=${#fields.hasErrors('confirmPassword')} ? 'confirmPassword-error' : null"
                   required>
            <button type="button"
                    class="auth-password-toggle"
                    data-password-toggle
                    data-target="confirmPassword"
                    data-password-name="mật khẩu xác nhận"
                    aria-controls="confirmPassword"
                    aria-label="Hiện mật khẩu xác nhận">Hiện</button>
          </div>
          <p id="confirmPassword-error"
             class="auth-field-error"
             th:if="${#fields.hasErrors('confirmPassword')}"
             th:errors="*{confirmPassword}">Lỗi xác nhận mật khẩu</p>
        </div>

        <button type="submit" class="auth-submit" data-loading-text="Đang lưu…">Đặt mật khẩu mới</button>
      </form>
    </section>
  </main>
  <script th:src="@{/js/loading-button.js}" src="/js/loading-button.js"></script>
  <script th:src="@{/js/form-validation.js}" defer></script>
</body>
</html>
